# Single source of run-time parameters (DOC-03 §5, DOC-05 §7).
# Sections are added milestone by milestone (currently M1-M7).

project:
  name: credit-card-fraud-detection
  model_version: "1.0.0"     # base; frozen model version = <this>+<git short sha> (DOC-03 MD-13)
  seed: 42

paths:
  raw: data/raw/creditcard.csv
  interim: data/interim/clean.csv
  validation_report: reports/validation/validation_report.json   # DOC-05 §23 DEV-01
  eda_dir: reports/eda                                            # descriptive only; not a DVC stage
  processed_dir: data/processed                                   # train/val/test/temporal_holdout.csv
  split_summary: reports/split_summary.json
  temporal_split_summary: reports/temporal/temporal_split_summary.json
  baseline_dir: reports/baseline                                  # M4 baseline training outputs
  candidates_dir: models/candidates                               # M5 tuned candidates: lr/rf/xgb.joblib
  tuning_dir: reports/tuning                                      # M5 tuning reports
  models_dir: models                                              # M6 frozen model.joblib + train_metadata.json
  reports_dir: reports                                            # M6 model_comparison.csv, threshold_analysis_<model>.csv, model_selection.md
  figures_dir: reports/figures                                    # M6 P/R-vs-threshold plots, validation confusion matrices
  test_metrics: reports/test_metrics.json                         # M7 evaluate (test set, evaluated once)
  temporal_dir: reports/temporal                                  # M7 evaluate_temporal outputs

schema:
  target: Class
  positive_label: 1
  ordering_column: Time
  features: [V1, V2, V3, V4, V5, V6, V7, V8, V9, V10, V11, V12, V13, V14,
             V15, V16, V17, V18, V19, V20, V21, V22, V23, V24, V25, V26, V27, V28, Amount]
  required_columns: [Time, V1, V2, V3, V4, V5, V6, V7, V8, V9, V10, V11, V12, V13, V14,
                     V15, V16, V17, V18, V19, V20, V21, V22, V23, V24, V25, V26, V27, V28,
                     Amount, Class]

validation:
  min_rows: 1
  # Warn when the fraud rate leaves the expected order of magnitude (documented ~0.17%). Provisional.
  expected_fraud_rate:
    min: 0.0001
    max: 0.01
  non_negative_columns: [Time, Amount]   # negative values are a hard fail (DOC-02 §3)
  outlier_iqr_multiplier: 3.0            # outliers are reported only, never removed

eda:
  top_k_features: 6          # most class-separating V-features shown in the KDE grid (DOC-02 §4 item 8)
  time_bin_seconds: 3600     # bin width for fraud rate over elapsed time (descriptive; no hour-of-day features)
  histogram_bins: 60
  correlation_top_pairs: 10  # strongest feature-feature pairs listed in the report
  figure_dpi: 110

split:                       # primary protocol on the development pool (DOC-02 §6)
  train: 0.70
  val: 0.15
  test: 0.15
  stratify: true
  prevalence_tolerance_pp: 0.02   # max |split prevalence - pool prevalence| in pp (DOC-01 SC-02). Provisional.
  row_id_column: row_id           # stable row identity for overlap checks; never a feature (DOC-05 IMP-03)

temporal:                    # secondary temporal robustness holdout (DOC-02 §21.3)
  holdout_fraction: 0.15          # fixed before any modelling; never tuned after seeing results
  min_fraud_warning: 20           # fewer holdout frauds -> low-confidence flag. Provisional.

preprocessing:               # fitted on train only, inside the model Pipeline (DOC-02 §7, TD-04)
  robust_scaled_features: [Amount]   # median impute -> RobustScaler; all other features: median impute -> StandardScaler

imbalance:                   # cost-sensitive learning only (DOC-02 §8, TD-06)
  strategy: class_weight

models:                      # the three candidates (DOC-02 §9). random_state = project.seed is injected in code;
  enabled: [logistic_regression, random_forest, xgboost]   # XGBoost scale_pos_weight is computed from train only.
  logistic_regression: {solver: lbfgs, max_iter: 1000, class_weight: balanced}
  random_forest: {class_weight: balanced_subsample, n_jobs: -1}
  xgboost: {objective: "binary:logistic", eval_metric: aucpr, tree_method: hist, n_jobs: -1}

tuning:                      # train-only CV search (DOC-02 §10, TD-09); validation is never used to pick hyperparameters
  cv_folds: 3                # StratifiedKFold(shuffle=True, random_state=project.seed)
  n_iter: 10                 # <= 10 per model; spaces with <= n_iter combinations are searched exhaustively (LR grid)
  scoring: average_precision
  search_spaces:             # exactly DOC-02 §10; do not enlarge (DOC-05 M5)
    logistic_regression:
      C: [0.01, 0.1, 1, 10]
    random_forest:
      n_estimators: [200, 400]
      max_depth: [null, 10, 20]
      min_samples_leaf: [1, 3, 5]
    xgboost:
      n_estimators: [200, 400, 600]
      max_depth: [3, 4, 6]
      learning_rate: [0.03, 0.1]
      subsample: [0.8, 1.0]
      colsample_bytree: [0.8, 1.0]
      min_child_weight: [1, 5]

threshold:                   # chosen on validation only (DOC-02 §13)
  r_min: 0.80                # confirmed after M6 validation review; fixed for the rest of the project (DOC-05 §23 DEC-01)
  r_min_confirmed: true      # false = provisional (reports flag it as needing confirmation before M7)
  grid: {start: 0.01, stop: 0.99, step: 0.01}
  include_pr_curve_points: true   # add the thresholds of precision_recall_curve to the grid
  fallback: f2               # if no threshold reaches r_min: maximise F2
  reference_threshold: 0.50  # reported only

selection:                   # DOC-02 §12 framework
  pr_auc_tie_tolerance: 0.01 # provisional

evaluation:                  # M7 final evaluation of the frozen model (DOC-02 §14, §21)
  bootstrap: {enabled: true, n: 1000, confidence: 0.95}   # seeded CIs for PR-AUC / Recall (DOC-02 §21.5; DOC-05 §23 DEC-04)
  inconclusive_fraud_cases: 2   # recall changes of at most this many fraud cases are treated as inconclusive (§21.6)

mlflow:                      # local store; DOC-03 §5 allows SQLite (MLflow 3.x refuses the file store)
  tracking_uri: sqlite:///mlflow.db
  experiment_name: credit-card-fraud-detection
