[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection"
version = "1.0.0"
description = "Credit card fraud detection: reproducible ML pipeline with MLOps boundaries"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]   # "." makes the FastAPI package `app` importable (DOC-04 §12)
addopts = "-ra"
markers = [
    "artifact: needs the real DVC outputs in models/ and data/processed/; skipped when absent (DOC-03 §9)",
]
